schema_version: 5
guidance: inputs/guidance-v6.md
title: Rowwise Layerwise Interval Certificates for Quantized Messages in Frozen Two-Layer GNN-to-SNN Conversion
chain: M=XW0; M_hat=Q_rowwise(M); H=relu(A M+b0); Z=A H W1+b_out
dimensions: A:NxN; M:NxH; Delta:NxH; W1:HxC
proposed: B_abs=abs(A) @ abs(A) @ Delta @ abs(W1)
minkowski: B_mink[i,k]=(abs(A)abs(A) @ rownorm(Delta,2))[i] * norm(W1[:,k],2)
global_outputwise: B_global_col[i,k]=rowsum(abs(A)abs(A))[i] * max(Delta) * norm(W1[:,k],1)
controls:
  global_uniform: B_abs equals B_global_col
  rowwise: every cell tightens at least 25 percent versus B_global_col
metrics:
  width_over_rms: median(all bound entries) / RMS(all actual errors)
  strong_width_threshold: none; width is descriptive
  tolerance: value <= bound + 1e-10 + 1e-12*abs(bound)
  precision: float64
strong_gate: 36 containment cells; B_abs<=B_mink; 18 global equality cells; 18 rowwise tightening cells >=25 percent; no clipping/NaN/Inf
interpretation: deterministic theorem/implementation containment, not statistical coverage
