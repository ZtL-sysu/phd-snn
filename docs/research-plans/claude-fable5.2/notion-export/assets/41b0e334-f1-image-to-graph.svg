<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">一张猫的照片怎么变成一张“图”（示意）</text>
  <!-- 第一步：原图 -->
  <g transform="translate(30,60)">
    <rect width="240" height="240" fill="#e8f1fb" stroke="#888"/>
    <polygon points="60,90 80,30 110,80" fill="#f2a65a"/>
    <polygon points="130,80 160,30 180,90" fill="#f2a65a"/>
    <circle cx="120" cy="130" r="70" fill="#f2a65a"/>
    <circle cx="95" cy="120" r="9" fill="#333"/><circle cx="145" cy="120" r="9" fill="#333"/>
    <polygon points="112,145 128,145 120,155" fill="#d9534f"/>
    <rect x="0" y="215" width="240" height="25" fill="#7cb87c"/>
    <text x="120" y="270" text-anchor="middle" font-size="14">① 原始照片</text>
  </g>
  <!-- 第二步：切块 -->
  <g transform="translate(330,60)">
    <rect width="240" height="240" fill="#e8f1fb" stroke="#888"/>
    <polygon points="60,90 80,30 110,80" fill="#f2a65a"/>
    <polygon points="130,80 160,30 180,90" fill="#f2a65a"/>
    <circle cx="120" cy="130" r="70" fill="#f2a65a"/>
    <circle cx="95" cy="120" r="9" fill="#333"/><circle cx="145" cy="120" r="9" fill="#333"/>
    <rect x="0" y="215" width="240" height="25" fill="#7cb87c"/>
    <g stroke="#222" stroke-width="1.5">
      <line x1="60" y1="0" x2="60" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/>
      <line x1="0" y1="60" x2="240" y2="60"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="180" x2="240" y2="180"/>
    </g>
    <text x="120" y="270" text-anchor="middle" font-size="14">② 切成小块，每块是一个“点”</text>
  </g>
  <!-- 第三步：节点与边 -->
  <g transform="translate(630,60)">
    <rect width="240" height="240" fill="#fafafa" stroke="#888"/>
    <!-- 连线：相似的块相连（猫身体块之间、背景块之间） -->
    <g stroke="#f08c2e" stroke-width="2">
      <line x1="90" y1="90" x2="150" y2="90"/><line x1="90" y1="90" x2="90" y2="150"/>
      <line x1="150" y1="90" x2="150" y2="150"/><line x1="90" y1="150" x2="150" y2="150"/>
      <line x1="90" y1="90" x2="150" y2="150"/><line x1="90" y1="30" x2="90" y2="90"/><line x1="150" y1="30" x2="150" y2="90"/>
    </g>
    <g stroke="#5b8fd6" stroke-width="2">
      <line x1="30" y1="30" x2="30" y2="90"/><line x1="30" y1="90" x2="30" y2="150"/><line x1="210" y1="30" x2="210" y2="90"/>
      <line x1="210" y1="90" x2="210" y2="150"/><line x1="30" y1="30" x2="210" y2="30"/>
    </g>
    <g stroke="#4a9a4a" stroke-width="2">
      <line x1="30" y1="210" x2="90" y2="210"/><line x1="90" y1="210" x2="150" y2="210"/><line x1="150" y1="210" x2="210" y2="210"/>
    </g>
    <g>
      <circle cx="30" cy="30" r="10" fill="#cfe0f5" stroke="#333"/><circle cx="90" cy="30" r="10" fill="#f2a65a" stroke="#333"/>
      <circle cx="150" cy="30" r="10" fill="#f2a65a" stroke="#333"/><circle cx="210" cy="30" r="10" fill="#cfe0f5" stroke="#333"/>
      <circle cx="30" cy="90" r="10" fill="#cfe0f5" stroke="#333"/><circle cx="90" cy="90" r="10" fill="#f2a65a" stroke="#333"/>
      <circle cx="150" cy="90" r="10" fill="#f2a65a" stroke="#333"/><circle cx="210" cy="90" r="10" fill="#cfe0f5" stroke="#333"/>
      <circle cx="30" cy="150" r="10" fill="#cfe0f5" stroke="#333"/><circle cx="90" cy="150" r="10" fill="#f2a65a" stroke="#333"/>
      <circle cx="150" cy="150" r="10" fill="#f2a65a" stroke="#333"/><circle cx="210" cy="150" r="10" fill="#cfe0f5" stroke="#333"/>
      <circle cx="30" cy="210" r="10" fill="#7cb87c" stroke="#333"/><circle cx="90" cy="210" r="10" fill="#7cb87c" stroke="#333"/>
      <circle cx="150" cy="210" r="10" fill="#7cb87c" stroke="#333"/><circle cx="210" cy="210" r="10" fill="#7cb87c" stroke="#333"/>
    </g>
    <text x="120" y="270" text-anchor="middle" font-size="14">③ 内容相似的块之间连线</text>
  </g>
  <text x="450" y="355" text-anchor="middle" font-size="13" fill="#555">示意图：块数、连线都是为说明而画，不是任何模型的真实建图结果。ViG 这类模型会在每一层按“特征相似”重新连线。</text>
</svg>
