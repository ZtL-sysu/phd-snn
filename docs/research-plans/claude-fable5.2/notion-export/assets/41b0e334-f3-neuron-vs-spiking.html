<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>普通神经元与脉冲神经元</title>
<style>
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;margin:12px;color:#222}
.row{display:flex;gap:24px;flex-wrap:wrap}.panel{border:1px solid #ccc;border-radius:8px;padding:10px;width:420px}
h3{margin:4px 0 8px;font-size:16px}button{font-size:14px;padding:4px 12px;margin-right:6px}
.note{color:#666;font-size:12px;margin-top:8px}
</style></head><body>
<div><button id="play">暂停</button><button id="reset">重来</button>
输入强度 <input id="inp" type="range" min="0.05" max="0.95" step="0.05" value="0.3"> <span id="iv">0.30</span></div>
<div class="row">
 <div class="panel"><h3>普通神经元（ANN）：每一刻都直接输出一个数</h3><svg id="a" width="400" height="180"></svg>
  <div>当前输出：<b id="aout"></b></div></div>
 <div class="panel"><h3>脉冲神经元（IF）：电压攒够阈值才“发一下”</h3><svg id="s" width="400" height="180"></svg>
  <div>已过时间步：<b id="t">0</b>　发放次数：<b id="n">0</b>　发放率 = 次数 / 步数：<b id="r">-</b></div></div>
</div>
<div class="note">示意，非真实数据。阈值设为 1；每个时间步把“输入强度”加到电压上，电压 ≥ 1 时发出一个脉冲并减去 1（减法复位）。步数越多，发放率越接近左边那个数。</div>
<script>
const NS="http://www.w3.org/2000/svg";let x=0.3,t=0,v=0,n=0,hist=[],spikes=[],run=true;
const inp=document.getElementById('inp');inp.oninput=()=>{x=+inp.value;document.getElementById('iv').textContent=x.toFixed(2);reset()};
function el(svg,tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e}
function reset(){t=0;v=0;n=0;hist=[];spikes=[];draw()}
document.getElementById('reset').onclick=reset;
document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'暂停':'播放'};
function step(){t++;v+=x;let sp=0;if(v>=1){v-=1;n++;sp=1}hist.push(v);spikes.push(sp);if(t>40)reset();draw()}
function draw(){const a=document.getElementById('a'),s=document.getElementById('s');a.innerHTML='';s.innerHTML='';
 el(a,'line',{x1:20,y1:160,x2:390,y2:160,stroke:'#999'});
 el(a,'rect',{x:180,y:160-x*140,width:60,height:x*140,fill:'#5b8fd6'});
 el(a,'text',{x:210,y:150-x*140,'text-anchor':'middle','font-size':14}).textContent=x.toFixed(2);
 document.getElementById('aout').textContent=x.toFixed(2)+'（不随时间变化）';
 el(s,'line',{x1:20,y1:110,x2:390,y2:110,stroke:'#999'});
 el(s,'line',{x1:20,y1:30,x2:390,y2:30,stroke:'#d9534f','stroke-dasharray':'4'});
 el(s,'text',{x:392,y:34,'font-size':11,fill:'#d9534f','text-anchor':'end'}).textContent='阈值';
 hist.forEach((h,i)=>{const X=25+i*9;el(s,'rect',{x:X,y:110-h*80,width:6,height:h*80,fill:'#f2a65a'});
   if(spikes[i])el(s,'line',{x1:X+3,y1:125,x2:X+3,y2:170,stroke:'#222','stroke-width':3})});
 el(s,'text',{x:22,y:178,'font-size':11}).textContent='下方竖线 = 发出的脉冲';
 document.getElementById('t').textContent=t;document.getElementById('n').textContent=n;
 document.getElementById('r').textContent=t?(n/t).toFixed(2):'-'}
reset();setInterval(()=>{if(run)step()},450);
</script></body></html>
