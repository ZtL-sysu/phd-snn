<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="300" fill="#fff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold">普通神经元 vs 脉冲神经元（示意，非真实数据）</text>
  <g transform="translate(30,50)">
    <rect width="380" height="200" fill="#f7f9fc" stroke="#ccc" rx="8"/>
    <text x="190" y="24" text-anchor="middle" font-size="14">普通神经元：直接输出一个数</text>
    <line x1="20" y1="170" x2="360" y2="170" stroke="#999"/>
    <rect x="160" y="128" width="60" height="42" fill="#5b8fd6"/>
    <text x="190" y="120" text-anchor="middle" font-size="14">0.3</text>
    <text x="190" y="192" text-anchor="middle" font-size="12" fill="#555">输入 0.3 → 输出 0.3，一步完成</text>
  </g>
  <g transform="translate(470,50)">
    <rect width="400" height="200" fill="#fdf8f2" stroke="#ccc" rx="8"/>
    <text x="200" y="24" text-anchor="middle" font-size="14">脉冲神经元：电压累积，过阈值才发一下</text>
    <line x1="20" y1="40" x2="380" y2="40" stroke="#d9534f" stroke-dasharray="4"/>
    <text x="380" y="36" text-anchor="end" font-size="11" fill="#d9534f">阈值 1</text>
    <line x1="20" y1="120" x2="380" y2="120" stroke="#999"/>
    <!-- 10 steps of v with input 0.3: .3 .6 .9 1.2->.2 .5 .8 1.1->.1 .4 .7 1.0->0 -->
    <g fill="#f2a65a">
      <rect x="30" y="96" width="20" height="24"/><rect x="65" y="72" width="20" height="48"/><rect x="100" y="48" width="20" height="72"/>
      <rect x="135" y="104" width="20" height="16"/><rect x="170" y="80" width="20" height="40"/><rect x="205" y="56" width="20" height="64"/>
      <rect x="240" y="112" width="20" height="8"/><rect x="275" y="88" width="20" height="32"/><rect x="310" y="64" width="20" height="56"/>
      <rect x="345" y="119" width="20" height="1"/>
    </g>
    <g stroke="#222" stroke-width="3"><line x1="145" y1="130" x2="145" y2="165"/><line x1="250" y1="130" x2="250" y2="165"/><line x1="355" y1="130" x2="355" y2="165"/></g>
    <text x="200" y="188" text-anchor="middle" font-size="12" fill="#555">10 个时间步里发了 3 次：发放率 3/10 = 0.3，与左边的输出一致</text>
  </g>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#555">橙色柱 = 每一步的电压；黑色竖线 = 发出的脉冲。电压到阈值后减去阈值继续累积（减法复位）。</text>
</svg>
