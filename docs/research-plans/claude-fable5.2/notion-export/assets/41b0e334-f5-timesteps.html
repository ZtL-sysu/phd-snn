<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>时间步多少的影响</title>
<style>body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;margin:12px;color:#222}
button{font-size:14px;padding:4px 12px}.note{color:#666;font-size:12px}</style></head><body>
<div>要表示的数 x = <b>0.37</b>　时间步 T = <input id="T" type="range" min="1" max="32" value="4"> <b id="tv">4</b>
<button id="play">自动播放</button></div>
<svg id="g" width="760" height="230"></svg>
<div>发放次数（≈ 耗电）：<b id="n"></b>　还原出的值 = 次数 / T：<b id="r"></b>　误差：<b id="e"></b></div>
<p class="note">示意，非真实数据。一个阈值为 1 的脉冲神经元，每步输入 0.37，减法复位。时间步越多，还原越准，但发的脉冲也越多（越费电）。真实网络里误差会逐层累积，所以低时间步更难。</p>
<script>
const NS="http://www.w3.org/2000/svg",x=0.37;let run=false,timer=null;
const T=document.getElementById('T');T.oninput=draw;
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e}
const g=document.getElementById('g');
function sim(T){let v=0,n=0,s=[];for(let i=0;i<T;i++){v+=x;if(v>=1-1e-9){v-=1;n++;s.push(1)}else s.push(0)}return{n,s}}
function draw(){const t=+T.value;document.getElementById('tv').textContent=t;g.innerHTML='';
 const {n,s}=sim(t);const w=Math.min(22,700/t);
 el('text',{x:10,y:20,'font-size':13}).textContent='每一格是一个时间步，黑格 = 这一步发了脉冲';
 s.forEach((b,i)=>el('rect',{x:10+i*w,y:30,width:w-2,height:40,fill:b?'#222':'#eee'}));
 el('text',{x:10,y:105,'font-size':13}).textContent='误差随 T 的变化（橙点 = 当前 T）';
 el('line',{x1:40,y1:210,x2:740,y2:210,stroke:'#999'});el('line',{x1:40,y1:110,x2:40,y2:210,stroke:'#999'});
 for(let k=1;k<=32;k++){const e=Math.abs(x-sim(k).n/k);const X=40+k*21,Y=210-e/0.4*100;
  el('circle',{cx:X,cy:Y,r:k==t?6:3,fill:k==t?'#f08c2e':'#5b8fd6'})}
 el('text',{x:44,y:226,'font-size':11}).textContent='T=1';el('text',{x:700,y:226,'font-size':11}).textContent='T=32';
 document.getElementById('n').textContent=n;document.getElementById('r').textContent=(n/t).toFixed(3);
 document.getElementById('e').textContent=Math.abs(x-n/t).toFixed(3)}
document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'暂停':'自动播放';
 if(run)timer=setInterval(()=>{T.value=(+T.value%32)+1;draw()},600);else clearInterval(timer)};
draw();
</script></body></html>
