<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="860" height="300" fill="#fff"/>
  <text x="430" y="26" text-anchor="middle" font-size="17" font-weight="bold">时间步越多越准，但脉冲越多越费电（示意，非真实数据）</text>
  <text x="430" y="48" text-anchor="middle" font-size="13" fill="#555">要表示的数是 0.37；一个阈值为 1、减法复位的脉冲神经元，每步输入 0.37</text>
  <g font-size="13">
    <text x="40" y="85" font-weight="bold">时间步 T</text><text x="160" y="85" font-weight="bold">脉冲序列（黑 = 发放）</text>
    <text x="620" y="85" font-weight="bold">发放次数</text><text x="700" y="85" font-weight="bold">还原值</text><text x="780" y="85" font-weight="bold">误差</text>
    <text x="60" y="113">1</text><rect x="160" y="98" width="12" height="20" fill="#eee"/>
    <text x="640" y="113">0</text><text x="705" y="113">0.000</text><text x="780" y="113">0.370</text>
    <text x="60" y="143">4</text>
    <g><rect x="160" y="128" width="12" height="20" fill="#eee"/><rect x="174" y="128" width="12" height="20" fill="#eee"/><rect x="188" y="128" width="12" height="20" fill="#222"/><rect x="202" y="128" width="12" height="20" fill="#eee"/></g>
    <text x="640" y="143">1</text><text x="705" y="143">0.250</text><text x="780" y="143">0.120</text>
    <text x="60" y="173">8</text>
    <g fill="#eee"><rect x="160" y="158" width="12" height="20"/><rect x="174" y="158" width="12" height="20"/><rect x="202" y="158" width="12" height="20"/><rect x="216" y="158" width="12" height="20"/><rect x="244" y="158" width="12" height="20"/><rect x="258" y="158" width="12" height="20"/></g>
    <g fill="#222"><rect x="188" y="158" width="12" height="20"/><rect x="230" y="158" width="12" height="20"/></g>
    <text x="640" y="173">2</text><text x="705" y="173">0.250</text><text x="780" y="173">0.120</text>
    <text x="60" y="203">16</text><text x="160" y="203" fill="#555">…（16 格中 5 个黑格）</text>
    <text x="640" y="203">5</text><text x="705" y="203">0.313</text><text x="780" y="203">0.058</text>
    <text x="60" y="233">32</text><text x="160" y="233" fill="#555">…（32 格中 11 个黑格）</text>
    <text x="640" y="233">11</text><text x="705" y="233">0.344</text><text x="780" y="233">0.026</text>
  </g>
  <text x="430" y="275" text-anchor="middle" font-size="12" fill="#555">还原值 = 发放次数 ÷ T。T 从 1 增到 32，误差从 0.37 降到 0.026，但脉冲从 0 个增到 11 个。真实网络里误差还会逐层累积。</text>
</svg>
