<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>动态选邻居为什么可能出错</title>
<style>body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;margin:12px;color:#222}
button{font-size:14px;padding:4px 12px}.note{color:#666;font-size:12px}.bad{color:#d9534f;font-weight:bold}.ok{color:#2e7d32;font-weight:bold}</style></head><body>
<div>每个距离最多偏差 δ = <input id="d" type="range" min="0" max="0.5" step="0.01" value="0"> <b id="dv">0.00</b>
<button id="play">自动播放</button>　<button id="seed">换一组误差</button></div>
<svg id="g" width="780" height="260"></svg>
<div id="msg"></div>
<p class="note">示意，非真实数据。中心块要从 6 个候选块里选最近的 k = 3 个作为邻居。第 3 近（距离 2.00）和第 4 近（距离 2.15）只差 0.15。
只要每个距离的偏差 δ 小于这个间隔的一半（0.075），邻居集合一定不变；超过以后就可能互换。若每个点的特征误差不超过 ε，则任意两点距离的偏差不超过 2ε，所以对应的条件是“间隔 &gt; 4ε”（见 questions.md Q9）。</p>
<script>
const NS="http://www.w3.org/2000/svg",g=document.getElementById('g');
const names=['A','B','C','D','E','F'],D=[1.0,1.4,2.0,2.15,3.0,3.6],K=3;let U=[0.3,-0.6,0.9,-0.8,0.2,-0.4],run=false,timer=null;
const sl=document.getElementById('d');sl.oninput=draw;
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e}
function topk(ds){return ds.map((d,i)=>[d,i]).sort((a,b)=>a[0]-b[0]).slice(0,K).map(p=>p[1]).sort()}
function draw(){const d=+sl.value;document.getElementById('dv').textContent=d.toFixed(2);g.innerHTML='';
 const P=D.map((x,i)=>x+d*U[i]);const t0=topk(D),t1=topk(P);
 const X=v=>60+v*180;
 el('text',{x:10,y:24,'font-size':13}).textContent='上：真实距离　　下：带误差的距离（绿色 = 被选为邻居）';
 [['真实',D,t0,70],['带误差',P,t1,170]].forEach(([lab,ds,sel,y])=>{
  el('line',{x1:40,y1:y,x2:760,y2:y,stroke:'#999'});el('text',{x:4,y:y+4,'font-size':12}).textContent=lab;
  el('circle',{cx:40,cy:y,r:9,fill:'#f2a65a',stroke:'#333'});
  ds.forEach((v,i)=>{const on=sel.includes(i);el('circle',{cx:X(v),cy:y,r:9,fill:on?'#4caf50':'#ddd',stroke:'#333'});
   el('text',{x:X(v),y:y-14,'text-anchor':'middle','font-size':12}).textContent=names[i]+' '+v.toFixed(2)})});
 const same=t0.join()==t1.join();
 document.getElementById('msg').innerHTML='真实邻居：'+t0.map(i=>names[i]).join('、')+'　带误差后：'+t1.map(i=>names[i]).join('、')+'　'+
  (same?'<span class="ok">邻居没变</span>':'<span class="bad">邻居变了：第 3 近和第 4 近互换</span>')+
  (d<0.075?'　（δ &lt; 0.075，保证不变）':'')}
document.getElementById('seed').onclick=()=>{U=U.map(()=>Math.random()*2-1);draw()};
document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'暂停':'自动播放';
 if(run)timer=setInterval(()=>{let v=+sl.value+0.01;if(v>0.5)v=0;sl.value=v;draw()},200);else clearInterval(timer)};
draw();
</script></body></html>
