<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>视频里只算变化的部分</title>
<style>body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;margin:12px;color:#222}
button{font-size:14px;padding:4px 12px;margin-right:6px}.note{color:#666;font-size:12px}.row{display:flex;gap:24px;flex-wrap:wrap}</style></head><body>
<div><button id="play">暂停</button><button id="next">下一帧</button>
<label><input type="checkbox" id="thr" checked> 小于阈值的变化不传（截断）</label></div>
<div class="row"><div><b>当前帧</b><br><svg id="f" width="300" height="300"></svg></div>
<div><b>第 1 层要重算的格子（红）</b><br><svg id="l1" width="300" height="300"></svg></div>
<div><b>第 2 层要重算的格子（红）</b><br><svg id="l2" width="300" height="300"></svg></div></div>
<div id="msg"></div>
<p class="note">示意，非真实数据。猫不动，只有一个毛线球在移动；画面边上有轻微闪烁（很小的变化）。
第 1 层：只有变化的格子要重算。第 2 层：一个 3×3 卷积会让变化扩散到周围一圈，所以要重算的范围变大——层数越多扩散越大（DeltaCNN 第 3.3 节：一个像素经过三层 3×3 卷积会扩散到 49 个像素）。勾选“截断”后，太小的变化直接丢掉，扩散就被压住了。</p>
<script>
const NS="http://www.w3.org/2000/svg",N=10,C=30;let fr=0,run=true;
function cat(){const m=[];for(let r=0;r<N;r++){m.push([]);for(let c=0;c<N;c++){let v=0.1;
 const dr=r-5,dc=c-4.5;if(dr*dr+dc*dc<9)v=0.7;if((r==1||r==2)&&(c==2||c==7))v=0.7;if(r==9)v=0.4;m[r].push(v)}}return m}
function frame(k){const m=cat();const bc=(k%8)+1;m[7][bc]=1.0;m[7][Math.min(9,bc+1)]=1.0;
 if(k%2)m[0][9]+=0.03;return m}
function diff(a,b,useThr){const d=[];for(let r=0;r<N;r++){d.push([]);for(let c=0;c<N;c++){const x=Math.abs(a[r][c]-b[r][c]);d[r].push(useThr?x>0.1:x>0)}}return d}
function dil(d){const o=[];for(let r=0;r<N;r++){o.push([]);for(let c=0;c<N;c++){let on=false;for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const R=r+i,Cc=c+j;if(R>=0&&R<N&&Cc>=0&&Cc<N&&d[R][Cc])on=true}o[r].push(on)}}return o}
function grid(id,f){const s=document.getElementById(id);s.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const e=document.createElementNS(NS,'rect');
 e.setAttribute('x',c*C);e.setAttribute('y',r*C);e.setAttribute('width',C-1);e.setAttribute('height',C-1);e.setAttribute('fill',f(r,c));s.appendChild(e)}}
function draw(){const a=frame(fr),b=frame(fr+1),thr=document.getElementById('thr').checked;
 const d1=diff(a,b,thr),d2=dil(d1);
 grid('f',(r,c)=>{const v=b[r][c];return v>=1?'#c0392b':v>=0.7?'#f2a65a':v>=0.4?'#7cb87c':'#e8f1fb'});
 grid('l1',(r,c)=>d1[r][c]?'#d9534f':'#eee');grid('l2',(r,c)=>d2[r][c]?'#d9534f':'#eee');
 const n1=d1.flat().filter(x=>x).length,n2=d2.flat().filter(x=>x).length;
 document.getElementById('msg').textContent=`第 1 层重算 ${n1}/100 格，第 2 层重算 ${n2}/100 格；不做差分时每层都要算 100 格。`}
document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'暂停':'播放'};
document.getElementById('next').onclick=()=>{fr++;draw()};document.getElementById('thr').onchange=draw;
draw();setInterval(()=>{if(run){fr++;draw()}},900);
</script></body></html>
